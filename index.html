<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LSC Record High &middot; Excel Export</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
  :root { --navy:#1F3864; --purple:#5B2A86; --ink:#262626; --muted:#6b7280; --line:#d9dce3; --bg:#f4f5f8; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:Arial, Helvetica, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:40px 20px 60px; }
  h1 { margin:0; font-size:24px; color:var(--navy); }
  .sub { margin:6px 0 24px; color:var(--muted); font-size:14px; line-height:1.5; }
  .drop { display:block; background:#fff; border:2px dashed #b8bfcc; border-radius:14px; padding:42px 20px;
          text-align:center; cursor:pointer; transition:border-color .15s, background .15s; }
  .drop.over { border-color:var(--navy); background:#eef3fb; }
  .drop input { display:none; }
  .drop-icon { font-size:34px; line-height:1; }
  .drop-main { margin-top:12px; font-size:17px; font-weight:bold; }
  .drop-sub { margin-top:6px; font-size:13px; color:var(--muted); }
  #status { margin-top:18px; font-size:14px; line-height:1.5; white-space:pre-wrap; }
  #status.err { color:#b42318; background:#fff4f2; border:1px solid #f3c7c0; border-radius:10px; padding:12px 14px; font-size:12px; }
  #result { margin-top:18px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px; }
  #result p { margin:0 0 14px; font-size:14px; line-height:1.5; }
  .btns { display:flex; gap:10px; flex-wrap:wrap; }
  .btns button { flex:1 1 200px; border:0; border-radius:10px; padding:13px 14px; color:#fff; font-size:15px;
                 font-weight:bold; cursor:pointer; font-family:inherit; }
  .b-pc { background:var(--navy); }
  .b-sc { background:var(--purple); }
  .note { margin-top:12px; font-size:12px; color:var(--muted); }
  .clear { margin-top:12px; display:inline-block; font-size:12px; color:var(--muted); text-decoration:underline; cursor:pointer; background:none; border:0; padding:0; font-family:inherit; }
</style>
</head>
<body>
<main>
  <h1>LSC Record High</h1>
  <p class="sub">Drop the daily passenger Excel files. Two reports download automatically:
    <b style="color:var(--navy);white-space:nowrap">Post-COVID</b> and <b style="color:var(--purple);white-space:nowrap">Since Commissioning</b>.</p>

  <label class="drop" id="drop">
    <input type="file" id="fileInput" accept=".xlsx,.xls" multiple>
    <div class="drop-icon">&#128194;</div>
    <div class="drop-main">Drag Excel files here</div>
    <div class="drop-sub">or tap to choose &middot; .xlsx / .xls &middot; multiple files OK</div>
  </label>

  <div id="status"></div>

  <div id="result" hidden>
    <p id="resultText"></p>
    <div class="btns">
      <button class="b-pc" id="btnPC" type="button">&#11015; Post-COVID</button>
      <button class="b-sc" id="btnSC" type="button">&#11015; Since Commissioning</button>
    </div>
    <div class="note">Both files download automatically. If one did not start, tap its button.</div>
    <button class="clear" id="btnClear" type="button">Clear loaded data</button>
  </div>
</main>
<script>
// LSC Record High - Excel export only.
// Drop the daily passenger files; the page builds two reports (Post-COVID and Since
// Commissioning) from the same data and downloads them.
// Reading, holiday and analysis code below is carried over unchanged from lsc-v3-final.

const TOP_N = 5;
const POST_COVID_DATE = '2023-01-08';   // border fully reopened
const COMM_DATE = '2007-08-15';         // LSC control point commissioned
let allDays = [];
let allFileNames = [];

// --- READ DAILY FILES -------------------------------------------------------------
function toNum(v){
  if(v===null||v===undefined||v===''||v==='-')return null;
  const n=Number(String(v).replace(/,/g,''));return isNaN(n)?null:n;
}
function excelSerial(n){
  const d=new Date(Math.round((n-25569)*86400000));
  return`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
}
function cellToDate(v){
  if(v===null||v===undefined)return null;
  const s=String(v).trim();
  // YYYY/M/D or YYYY-MM-DD
  let m=s.match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if(m)return`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  if(typeof v==='number'&&v>35000&&v<60000)return excelSerial(v);
  return null;
}
function isTimeSlot(v){
  if(!v)return false;
  const s=String(v).trim();
  return /^\d{4}\s*[-–]\s*(\d{4}|[Cc]lose)/i.test(s)||/^CBS$/i.test(s);
}
function isDateRow(row, maxCol){
  // maxCol: if given, only scan cols 0..maxCol-1 for "Date:" marker.
  // This prevents the Hourly Average block (far right columns) from
  // triggering a false break when reading the last day of the month.
  const limit = (maxCol !== undefined) ? Math.min(maxCol, row.length) : row.length;
  for(let i=0; i<limit; i++){
    const s=String(row[i]||'').trim();
    if(s==='Date:'||/Date:\s*\d{4}[\/\-]/.test(s)) return true;
  }
  return false;
}
function extractDate(row){
  for(let i=0;i<row.length;i++){
    const s=String(row[i]||'').trim();
    const m=s.match(/Date:\s*(\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2})/);
    if(m){const d=cellToDate(m[1]);if(d)return d;}
    if(s==='Date:'||s.endsWith('Date:')){
      for(let j=i+1;j<Math.min(i+5,row.length);j++){
        const d=cellToDate(row[j]);if(d)return d;
      }
    }
  }
  for(const c of row){const d=cellToDate(c);if(d&&d>'1990-01-01')return d;}
  return null;
}
function findTimeCol(rows,start){
  for(let r=start;r<Math.min(start+15,rows.length);r++)
    for(let c=0;c<rows[r].length;c++)
      if(isTimeSlot(rows[r][c]))return c;
  return -1;
}
function parseSheet(ws,fileName,sheetName){
  const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
  const days=[];
  for(let r=0;r<raw.length;r++){
    if(!isDateRow(raw[r]))continue;
    const date=extractDate(raw[r]);
    if(!date)continue;
    const tc=findTimeCol(raw,r+1);
    if(tc<0)continue;
    const hrs=[];let totalRow=null;
    for(let i=r+1;i<raw.length;i++){
      const row=raw[i];
      const cell=String(row[tc]||'').trim();
      if(isDateRow(row, tc+2))break; // only left-side Date: breaks; Hourly Avg block ignored
      if(/^Total$/i.test(cell)){totalRow=row;break;}
      if(isTimeSlot(cell)){
        hrs.push({
          time:cell,
          arr_res:toNum(row[tc+1]),arr_vis:toNum(row[tc+2]),arr_tot:toNum(row[tc+3]),
          dep_res:toNum(row[tc+4]),dep_vis:toNum(row[tc+5]),dep_tot:toNum(row[tc+6]),
          ad_res:toNum(row[tc+7]),ad_vis:toNum(row[tc+8]),ad_tot:toNum(row[tc+9]),
        });
      }
    }
    // Daily totals
    const dt={};
    const keys=['arr_res','arr_vis','arr_tot','dep_res','dep_vis','dep_tot','ad_res','ad_vis','ad_tot'];
    for(const k of keys){
      if(totalRow){dt[k]=toNum(totalRow[tc+keys.indexOf(k)+1]);}
      else{dt[k]=hrs.reduce((s,h)=>s+(h[k]||0),0)||null;}
    }
    days.push({date,dt,hrs,file:fileName,sheet:sheetName});
  }
  return days;
}

// --- RANKING AND FORMAT -----------------------------------------------------------
function topN(days,valueFn,n=TOP_N){
  return [...days]
    .map(d=>({day:d,value:valueFn(d)}))
    .filter(x=>x.value!==null&&x.value>0)
    .sort((a,b)=>b.value-a.value)
    .slice(0,n);
}
function topNHourly(days,valueFn,n=TOP_N){
  const candidates=[];
  for(const day of days){
    for(const hr of day.hrs){
      if(/^CBS$/i.test(hr.time))continue;
      const v=valueFn(hr);
      if(v!==null&&v>0)candidates.push({day,hr,value:v});
    }
  }
  return candidates.sort((a,b)=>b.value-a.value).slice(0,n);
}
function fDate(s){
  if(!s)return'';
  const p=s.split('-');
  const d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric',timeZone:'UTC'}).replace(/\//g,'-');
}
function dayOfWeek(s){
  if(!s)return'';
  const _sp=s.split('-');return new Date(Date.UTC(+_sp[0],+_sp[1]-1,+_sp[2])).toLocaleDateString('en-US',{weekday:'short',timeZone:'UTC'});
}

// --- HK HOLIDAYS AND REMARKS ------------------------------------------------------
const HK_GAZETTE_PH = {
  // 2023

  '2023-01-22': 'Lunar New Year (Day 1)',
  '2023-01-23': 'Lunar New Year (Day 2)',

  '2024-01-01': "New Year's Day",
  '2024-02-10': 'Lunar New Year (Day 1)',
  '2024-02-12': 'Lunar New Year (Day 3)',
  '2024-02-13': 'Lunar New Year (Day 4 — Sub)',
  '2024-03-29': 'Good Friday',
  '2024-03-30': 'Day following Good Friday',
  '2024-04-01': 'Easter Monday',
  '2024-04-04': 'Ching Ming Festival',
  '2024-05-01': 'Labour Day',
  '2024-05-15': "Buddha's Birthday",
  '2024-06-10': 'Dragon Boat Festival (Tuen Ng)',
  '2024-07-01': 'HKSAR Establishment Day',
  '2024-09-18': 'Day following Mid-Autumn Festival',
  '2024-10-01': 'National Day',
  '2024-10-11': 'Chung Yeung Festival',
  '2024-12-25': 'Christmas Day',
  '2024-12-26': 'First Weekday after Christmas',
  // 2025
  '2025-01-01': "New Year's Day",
  '2025-01-29': 'Lunar New Year (Day 1)',
  '2025-01-30': 'Lunar New Year (Day 2)',
  '2025-01-31': 'Lunar New Year (Day 3)',
  '2025-04-04': 'Ching Ming Festival',
  '2025-04-18': 'Good Friday',
  '2025-04-19': 'Day following Good Friday',
  '2025-04-21': 'Easter Monday',
  '2025-05-01': 'Labour Day',
  '2025-05-05': "Buddha's Birthday",
  '2025-05-31': 'Dragon Boat Festival (Tuen Ng)',
  '2025-07-01': 'HKSAR Establishment Day',
  '2025-10-01': 'National Day',
  '2025-10-07': 'Day following Mid-Autumn Festival',
  '2025-10-29': 'Chung Yeung Festival',
  '2025-12-25': 'Christmas Day',
  '2025-12-26': 'First Weekday after Christmas',
  // 2026 (note: Ching Ming on Sun - Mon sub; clashes with Easter Mon - extra Tue PH)
  '2026-01-01': "New Year's Day",
  '2026-01-02': 'Mainland Public Holiday',
  '2026-02-17': 'Lunar New Year (Day 1)',
  '2026-02-18': 'Lunar New Year (Day 2)',
  '2026-02-19': 'Lunar New Year (Day 3)',
  '2026-04-03': 'Good Friday',
  '2026-04-04': 'Day following Good Friday',
  '2026-04-05': 'Easter Sunday',
  '2026-04-06': 'Easter Monday / Day following Ching Ming',
  '2026-04-07': 'Additional Public Holiday (Ching Ming + Easter overlap)',
  '2026-05-01': 'Labour Day',
  '2026-05-25': "Day following Buddha's Birthday",
  '2026-06-19': 'Dragon Boat Festival (Tuen Ng)',
  '2026-07-01': 'HKSAR Establishment Day',
  '2026-09-26': 'Day following Mid-Autumn Festival',
  '2026-10-01': 'National Day',
  '2026-10-19': 'Day following Chung Yeung Festival',
  '2026-12-25': 'Christmas Day',
  '2026-12-26': 'First Weekday after Christmas',
};

function easterSunday(year){
  const a=year%19,b=Math.floor(year/100),c=year%100;
  const d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25);
  const g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30;
  const i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7;
  const m=Math.floor((a+11*h+22*l)/451);
  const month=Math.floor((h+l-7*m+114)/31);
  const day=((h+l-7*m+114)%31)+1;
  return new Date(year,month-1,day);
}
function dateAdd(d,days){const r=new Date(d);r.setDate(r.getDate()+days);return r;}
function toISO(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

const LUNAR_NEW_YEAR = {
  2003:[2,1],2004:[1,22],2005:[2,9],2006:[1,29],2007:[2,18],2008:[2,7],
  2009:[1,26],2010:[2,14],2011:[2,3],2012:[1,23],2013:[2,10],2014:[1,31],
  2015:[2,19],2016:[2,8],2017:[1,28],2018:[2,16],2019:[2,5],2020:[1,25],
  2021:[2,12],2022:[2,1],2023:[1,22],2024:[2,10],2025:[1,29],2026:[2,17],
  2027:[2,6],2028:[1,26],2029:[2,13],2030:[2,3],
};
const CHUNG_YEUNG = {
  2003:'2003-10-04',2004:'2004-10-22',2005:'2005-10-11',2006:'2006-10-30',
  2007:'2007-10-19',2008:'2008-10-07',2009:'2009-10-26',2010:'2010-10-16',
  2011:'2011-10-05',2012:'2012-10-23',2013:'2013-10-13',2014:'2014-10-02',
  2015:'2015-10-21',2016:'2016-10-09',2017:'2017-10-28',2018:'2018-10-17',
  2019:'2019-10-07',2020:'2020-10-25',2021:'2021-10-14',2022:'2022-10-04',
  2023:'2023-10-23',2024:'2024-10-11',2025:'2025-10-29',2026:'2026-10-18',
};
const TUEN_NG = {
  2003:'2003-06-04',2004:'2004-06-22',2005:'2005-06-11',2006:'2006-05-31',
  2007:'2007-06-19',2008:'2008-06-08',2009:'2009-05-28',2010:'2010-06-16',
  2011:'2011-06-06',2012:'2012-06-23',2013:'2013-06-12',2014:'2014-06-02',
  2015:'2015-06-20',2016:'2016-06-09',2017:'2017-05-30',2018:'2018-06-18',
  2019:'2019-06-07',2020:'2020-06-25',2021:'2021-06-14',2022:'2022-06-03',
  2023:'2023-06-22',2024:'2024-06-10',2025:'2025-05-31',2026:'2026-06-19',
};
const CHING_MING = {
  2003:'2003-04-05',2004:'2004-04-05',2005:'2005-04-05',2006:'2006-04-05',
  2007:'2007-04-05',2008:'2008-04-04',2009:'2009-04-04',2010:'2010-04-05',
  2011:'2011-04-05',2012:'2012-04-04',2013:'2013-04-04',2014:'2014-04-05',
  2015:'2015-04-05',2016:'2016-04-04',2017:'2017-04-04',2018:'2018-04-05',
  2019:'2019-04-05',2020:'2020-04-04',2021:'2021-04-04',2022:'2022-04-05',
  2023:'2023-04-05',2024:'2024-04-04',2025:'2025-04-04',2026:'2026-04-05',
};
const BUDDHAS_BIRTHDAY = {
  2003:'2003-05-09',2004:'2004-05-26',2005:'2005-05-15',2006:'2006-05-05',
  2007:'2007-05-24',2008:'2008-05-12',2009:'2009-05-02',2010:'2010-05-21',
  2011:'2011-05-10',2012:'2012-05-28',2013:'2013-05-17',2014:'2014-05-06',
  2015:'2015-05-25',2016:'2016-05-14',2017:'2017-05-03',2018:'2018-05-22',
  2019:'2019-05-12',2020:'2020-04-30',2021:'2021-05-19',2022:'2022-05-08',
  2023:'2023-05-26',2024:'2024-05-15',2025:'2025-05-05',2026:'2026-05-24',
};
const NATIONAL_GAMES_YEARS = [2021, 2025];

function getRemarks(dateStr){
  if(!dateStr) return '';

  // -- 1. Official gazette lookup first (2023-2026) --------------------------
  if(HK_GAZETTE_PH[dateStr]) return HK_GAZETTE_PH[dateStr];

  const d = new Date(dateStr+'T00:00:00');
  const year = d.getFullYear();
  const month = d.getMonth()+1;
  const day = d.getDate();
  const dow = d.getDay();
  const isWeekend = dow===0||dow===6;
  const isSat = dow===6;
  const isSun = dow===0;
  const isSummer = (month===7&&day>=15) || month===8; // Summer = Jul 15 - Aug 31

  // -- 2. Fixed-date public holidays (algorithmic fallback for other years) --
  if(month===1&&day===1) return "New Year's Day";
  if(month===1&&day===2&&dow===1) return "New Year's Day Holiday (Sub)";
  if(month===1&&day===2) return 'Mainland Public Holiday';
  if(month===4&&day===30) return 'Labour Week (Day Before)';
  if(month===5&&day===1) return 'Labour Day';
  if(month===5&&day===2&&dow===1) return 'Labour Day Holiday';
  if(month===6&&day===30) return 'Day before HKSAR Establishment Day';
  if(month===7&&day===1) return 'HKSAR Establishment Day';
  if(month===7&&day===2&&dow===1) return 'HKSAR Establishment Day Holiday';
  if(month===10&&day===1) return 'National Day';
  if(month===10&&day>=1&&day<=7){
    if(isWeekend) return `National Day Golden Week (${isSat?'Saturday':'Sunday'})`;
    return 'National Day Golden Week';
  }
  if(month===10&&day===8&&dow===1) return 'National Day Holiday';
  if(month===12&&day===31) return "New Year's Eve";
  if(month===12&&day===25) return 'Christmas Day';
  if(month===12&&day===26) return 'Boxing Day / First Weekday after Christmas';
  if(month===12&&day===27&&dow===1) return 'Christmas Holiday';

  // -- 3. Easter (computed for non-gazetted years) ---------------------------
  const easter = easterSunday(year);
  const easterDiff = Math.round((d-easter)/86400000);
  if(easterDiff===-2) return 'Good Friday';
  if(easterDiff===-1) return 'Easter Saturday';
  if(easterDiff===0)  return 'Easter Sunday';
  if(easterDiff===1)  return 'Easter Monday';
  if(easterDiff===2)  return 'Day after Easter Holiday';
  if(easterDiff>=-3&&easterDiff<=2)
    return `Easter Holiday${isWeekend?' ('+(isSat?'Saturday':'Sunday')+')':''}`;

  // -- 4. Lunar New Year -----------------------------------------------------
  const lny = LUNAR_NEW_YEAR[year];
  if(lny){
    const lnyDate = new Date(year,lny[0]-1,lny[1]);
    const lnyDiff = Math.round((d-lnyDate)/86400000);
    if(lnyDiff===0) return 'Lunar New Year (Day 1)';
    if(lnyDiff===1) return 'Lunar New Year (Day 2)';
    if(lnyDiff===2) return 'Lunar New Year (Day 3)';
    if(lnyDiff===-1) return 'Lunar New Year Eve';
    if(lnyDiff>=3&&lnyDiff<=6) return `Lunar New Year (Day ${lnyDiff+1})`;
    if(lnyDiff>=-7&&lnyDiff<0) return 'Pre-Lunar New Year';
  }

  // -- 5. Ching Ming ---------------------------------------------------------
  const chingMing = CHING_MING[year];
  if(chingMing){
    if(dateStr===chingMing) return 'Ching Ming Festival';
    const cmDate = new Date(chingMing);
    if(Math.round((d-cmDate)/86400000)===1&&dow===1) return 'Ching Ming Festival Holiday';
  }

  // -- 6. Buddha's Birthday -------------------------------------------------
  const bday = BUDDHAS_BIRTHDAY[year];
  if(bday&&dateStr===bday) return "Buddha's Birthday";
  if(bday){const bd=new Date(bday);if(Math.round((d-bd)/86400000)===1&&dow===1)return"Buddha's Birthday Holiday";}

  // -- 7. Tuen Ng / Dragon Boat ---------------------------------------------
  const tuenNg = TUEN_NG[year];
  if(tuenNg&&dateStr===tuenNg) return 'Dragon Boat Festival (Tuen Ng)';
  if(tuenNg){const tn=new Date(tuenNg);if(Math.round((d-tn)/86400000)===1&&dow===1)return'Tuen Ng Festival Holiday';}

  // -- 8. Chung Yeung -------------------------------------------------------
  const cy = CHUNG_YEUNG[year];
  if(cy&&dateStr===cy) return 'Chung Yeung Festival';
  if(cy){const cyd=new Date(cy);if(Math.round((d-cyd)/86400000)===1&&dow===1)return'Chung Yeung Festival Holiday';}

  // -- 9. National Games ----------------------------------------------------
  if(year===2025&&month===11&&day>=9&&day<=26)
    return `National Games 2025${isWeekend?' ('+(isSat?'Saturday':'Sunday')+')':''}`;
  if(year===2021&&month===9&&day>=15&&day<=27)
    return `National Games 2021${isWeekend?' ('+(isSat?'Saturday':'Sunday')+')':''}`;

  // -- 10. Labour Week (first week of May cross-border) ---------------------
  if(month===5&&day>=2&&day<=7){
    if(isWeekend) return `Labour Week (${isSat?'Saturday':'Sunday'})`;
    return 'Labour Week';
  }

  // -- 11. Summer period ----------------------------------------------------
  if(isSummer){
    if(isSat) return 'Summer Saturday';
    if(isSun) return 'Summer Sunday';
    if(month===7||month===8) return 'Summer Weekday';
  }

  // -- 12. Christmas holiday period -----------------------------------------
  if((month===12&&day>=22&&day<=24)||(month===12&&day===27&&dow!==1)){
    if(isWeekend) return `Christmas Holiday (${isSat?'Saturday':'Sunday'})`;
    return 'Christmas Holiday';
  }

  // -- 13. Weekends ---------------------------------------------------------
  if(isSat) return 'Saturday';
  if(isSun) return 'Sunday';
  return '';
}



// --- ANALYSIS AND FORECAST ----------------------------------------------------------
function getEaster(year){
  const a=year%19,b=Math.floor(year/100),c=year%100;
  const d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25);
  const g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30;
  const i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7;
  const m=Math.floor((a+11*h+22*l)/451);
  const mo=Math.floor((h+l-7*m+114)/31);
  const dy=((h+l-7*m+114)%31)+1;
  return new Date(year,mo-1,dy);
}
function isoDate(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

function avgHourlyProfile(days){
  const slots={};
  for(const day of days){
    for(const hr of day.hrs){
      if(/^CBS$/i.test(hr.time))continue;
      if(!slots[hr.time])slots[hr.time]={arr_res:[],arr_vis:[],arr_tot:[],dep_res:[],dep_vis:[],dep_tot:[],ad_tot:[]};
      const s=slots[hr.time];
      if(hr.arr_res!==null)s.arr_res.push(hr.arr_res);
      if(hr.arr_vis!==null)s.arr_vis.push(hr.arr_vis);
      if(hr.arr_tot!==null)s.arr_tot.push(hr.arr_tot);
      if(hr.dep_res!==null)s.dep_res.push(hr.dep_res);
      if(hr.dep_vis!==null)s.dep_vis.push(hr.dep_vis);
      if(hr.dep_tot!==null)s.dep_tot.push(hr.dep_tot);
      if(hr.ad_tot!==null)s.ad_tot.push(hr.ad_tot);
    }
  }
  const avg={};
  for(const [t,v] of Object.entries(slots)){
    const mean=arr=>arr.length?Math.round(arr.reduce((a,b)=>a+b,0)/arr.length):0;
    avg[t]={time:t,arr_res:mean(v.arr_res),arr_vis:mean(v.arr_vis),arr_tot:mean(v.arr_tot),
             dep_res:mean(v.dep_res),dep_vis:mean(v.dep_vis),dep_tot:mean(v.dep_tot),ad_tot:mean(v.ad_tot)};
  }
  // Sort by time slot
  return Object.values(avg).sort((a,b)=>a.time.localeCompare(b.time));
}

const BORDER_CLOSED_FROM = '2020-02-04';
const BORDER_CLOSED_TO   = '2023-01-07';
function isBorderClosed(dateStr){
  return dateStr >= BORDER_CLOSED_FROM && dateStr <= BORDER_CLOSED_TO;
}


// -- Timezone-safe date helpers ------------------------------------------------
// All calendar arithmetic uses UTC to avoid DST/timezone shifts in any locale.
function isoAddDays(isoStr, n){
  const p=isoStr.split('-');
  return new Date(Date.UTC(+p[0],+p[1]-1,+p[2]+n)).toISOString().slice(0,10);
}
function walkDates(start, end, fn){
  let cur=start;
  while(cur<=end){ fn(cur); cur=isoAddDays(cur,1); }
}

function yoyAnalysis(days){
  // Compare same calendar period across years (Jan 1 - as-at MM-DD)
  // IMPORTANT: Exclude days within the border closure period (COVID 2020-02-04 to 2023-01-07)
  // so "Since Commissioning" averages are not dragged down by zero-traffic closure days.
  if(!days.length) return [];

  // Use actual max date (sort guarantees last element, but be explicit)
  const sortedDates = days.map(d=>d.date).sort();
  const latestDate = sortedDates[sortedDates.length-1];
  const asAtMMDD = latestDate.substring(5); // 'MM-DD'

  const byYear={};
  for(const d of days){
    const y = d.date.substring(0,4);
    const mmdd = d.date.substring(5);
    // Same-period filter: only count Jan 1 - asAtMMDD in each year
    if(mmdd > asAtMMDD) continue;
    // Exclude closed / near-zero days from averages
    // (keeps 'Since Commissioning' stats meaningful despite COVID closure)
    const pax = d.dt.ad_tot||0;
    if(!byYear[y]) byYear[y]={total:0,arr:0,dep:0,res:0,vis:0,count:0,closedDays:0};
    if(isBorderClosed(d.date)){
      byYear[y].closedDays++;   // count but exclude from avg (border closure period)
      continue;
    }
    byYear[y].total += pax;
    byYear[y].arr   += (d.dt.arr_tot||0);
    byYear[y].dep   += (d.dt.dep_tot||0);
    byYear[y].res   += (d.dt.ad_res||0);
    byYear[y].vis   += (d.dt.ad_vis||0);
    byYear[y].count++;
  }
  // Recompute closedDays mathematically for each year:
  // Count calendar days in [Jan 1 - asAtMMDD] that fall in the closure period,
  // regardless of whether those days are present in the uploaded data.
  for(const [y, v] of Object.entries(byYear)){
    let closed=0;
    const periodEnd = y+'-'+asAtMMDD;
    const periodStart = y+'-01-01';
    // Walk every day in [periodStart .. periodEnd] - timezone-safe string walk
    walkDates(periodStart, periodEnd, iso=>{ if(isBorderClosed(iso)) closed++; });
    v.closedDays=closed;
  }

  return Object.entries(byYear).map(([y,v])=>({
    year:y, ...v,
    avgDaily: v.count ? Math.round(v.total/v.count) : 0,
    asAt: asAtMMDD,
    caveat: y==='2023' ? 'early-reopen' : null,
  })).sort((a,b)=>a.year.localeCompare(b.year));
}

// Full-year analysis - all days in each calendar year (no same-period cap)
// Excludes border closure days. Marks incomplete years (current year = partial).
function fullYearAnalysis(days){
  if(!days.length) return [];
  const currentYear = days[days.length-1].date.substring(0,4);
  const byYear={};
  for(const d of days){
    const y = d.date.substring(0,4);
    if(isBorderClosed(d.date)){ // skip closure days
      if(!byYear[y]) byYear[y]={total:0,arr:0,dep:0,res:0,vis:0,count:0,closedDays:0};
      byYear[y].closedDays++;
      continue;
    }
    if(!byYear[y]) byYear[y]={total:0,arr:0,dep:0,res:0,vis:0,count:0,closedDays:0};
    byYear[y].total += (d.dt.ad_tot||0);
    byYear[y].arr   += (d.dt.arr_tot||0);
    byYear[y].dep   += (d.dt.dep_tot||0);
    byYear[y].res   += (d.dt.ad_res||0);
    byYear[y].vis   += (d.dt.ad_vis||0);
    byYear[y].count++;
  }
  // Recompute closedDays for full year mathematically
  for(const [y, v] of Object.entries(byYear)){
    let closed=0;
    walkDates(y+'-01-01', y+'-12-31', iso=>{ if(isBorderClosed(iso)) closed++; });
    v.closedDays=closed;
  }
  return Object.entries(byYear).map(([y,v])=>({
    year:y, ...v,
    avgDaily: v.count ? Math.round(v.total/v.count) : 0,
    isPartial: y===currentYear,
    caveat: y==='2023' ? 'early-reopen' : null,
  })).sort((a,b)=>a.year.localeCompare(b.year));
}

function holidayAnalysis(days){
  const groups={};
  for(const d of days){
    const r=getRemarks(d.date)||'Weekday';
    // Normalise to category
    let cat='Weekday';
    if(r.includes('Easter'))cat='Easter Holiday';
    else if(r.includes('Lunar New Year'))cat='Lunar New Year';
    else if(r.includes('National Day Golden Week')||r.includes('National Day'))cat='National Day Golden Week';
    else if(r.includes('Labour'))cat='Labour Day/Week';
    else if(r.includes('Christmas'))cat='Christmas';
    else if(r.includes('Summer Saturday'))cat='Summer Saturday';
    else if(r.includes('Summer Sunday'))cat='Summer Sunday';
    else if(r.includes('Summer'))cat='Summer Weekday';
    else if(r.includes('National Games'))cat='National Games';
    else if(r.includes('Saturday'))cat='Saturday';
    else if(r.includes('Sunday'))cat='Sunday';
    else if(r.includes('Chung Yeung'))cat='Chung Yeung Festival';
    else if(r.includes('Tuen Ng')||r.includes('Dragon Boat'))cat='Dragon Boat Festival';
    else if(r.includes('Buddha'))cat="Buddha's Birthday";
    else if(r.includes('Ching Ming'))cat='Ching Ming Festival';
    else if(r.includes('HKSAR'))cat='HKSAR Establishment Day';
    if(!groups[cat])groups[cat]={vals:[],arrVals:[],depVals:[],resVals:[],visVals:[]};
    groups[cat].vals.push(d.dt.ad_tot||0);
    groups[cat].arrVals.push(d.dt.arr_tot||0);
    groups[cat].depVals.push(d.dt.dep_tot||0);
    groups[cat].resVals.push(d.dt.ad_res||0);
    groups[cat].visVals.push(d.dt.ad_vis||0);
  }
  return Object.entries(groups).map(([cat,v])=>({
    cat,count:v.vals.length,
    avg:Math.round(v.vals.reduce((a,b)=>a+b,0)/v.vals.length),
    max:Math.max(...v.vals),
    avgArr:Math.round(v.arrVals.reduce((a,b)=>a+b,0)/v.arrVals.length),
    avgDep:Math.round(v.depVals.reduce((a,b)=>a+b,0)/v.depVals.length),
    avgRes:Math.round(v.resVals.reduce((a,b)=>a+b,0)/v.resVals.length),
    avgVis:Math.round(v.visVals.reduce((a,b)=>a+b,0)/v.visVals.length),
  })).sort((a,b)=>b.avg-a.avg);
}

// --- Counter & e-Channel estimator ----------------------------------------
function weekdayWeekendAnalysis(days){
  // Weekday = Mon-Fri AND not a public holiday/special day
  // Weekend/PH = Sat, Sun, OR any holiday remark
  const weekdayArr=[], phwkArr=[];
  for(const d of days){
    const dow=new Date(Date.UTC(+d.date.slice(0,4),+d.date.slice(5,7)-1,+d.date.slice(8,10))).getUTCDay();
    const rem=getRemarks(d.date)||'';
    const isWknd=dow===0||dow===6;
    const isPH=rem!==''&&rem!=='Saturday'&&rem!=='Sunday'&&rem!=='Summer Weekday'&&rem!=='Weekday';
    if(isWknd||isPH){ phwkArr.push(d); } else { weekdayArr.push(d); }
  }
  function mean(arr,key){ return arr.length?Math.round(arr.reduce((s,d)=>s+(d.dt[key]||0),0)/arr.length):0; }
  function pk(arr){ return arr.length?Math.max(...arr.map(d=>d.dt.ad_tot||0)):0; }
  function build(arr){
    const avgTotal=mean(arr,'ad_tot');
    return{ count:arr.length, avg:avgTotal, avgTotal, peak:pk(arr),
            avgArr:mean(arr,'arr_tot'), avgDep:mean(arr,'dep_tot'),
            avgRes:mean(arr,'ad_res'), avgVis:mean(arr,'ad_vis') };
  }
  const wd=build(weekdayArr), wp=build(phwkArr);
  // Return with BOTH key names for compatibility
  return{ weekday:wd, phwk:wp, weekend_ph:wp };
}

const HOLIDAY_DEFS = [
  {
    type:'easter', icon:'🐣', label:y=>'Easter '+y,
    // Days are -2..+2 relative to Easter Sunday; anchor = Good Friday (offset -2)
    getAnchor: y => { const e=getEaster(y); return isoAddDays(isoDate(e),-2); },
    getDates: y => {
      const e=getEaster(y);
      const sun=isoDate(e);
      return [
        {date:isoAddDays(sun,-2), label:'Good Friday — PH',         color:'#f59e0b'},
        {date:isoAddDays(sun,-1), label:'Easter Saturday — PH',      color:'#a78bfa'},
        {date:sun,                label:'Easter Sunday — PH',        color:'var(--accent)'},
        {date:isoAddDays(sun, 1), label:'Easter Monday — PH',        color:'var(--res)'},
        {date:isoAddDays(sun, 2), label:'Day After Easter — Non-PH', color:'var(--vis)'},
      ];
    },
    matchDate: (date, y) => {
      const e=getEaster(y); const sun=isoDate(e);
      const offsets=[-2,-1,0,1,2];
      return offsets.some(o=>isoAddDays(sun,o)===date);
    },
  },
  {
    type:'labour', icon:'⚒️', label:y=>'Labour Day Golden Week '+y,
    getAnchor: y => y+'-05-01',
    getDates: y => {
      const labels=['Labour Day (May 1) — PH','May 2 — PH','May 3 — PH',
                    'May 4 — PH','May 5 — PH'];
      const cols=['#f59e0b','#a78bfa','var(--accent)','var(--res)','var(--vis)'];
      return Array.from({length:5},(_,i)=>({
        date: y+'-05-0'+(i+1),
        label: labels[i], color: cols[i]
      }));
    },
    matchDate: (date, y) => {
      const m=date.substring(5,7),d=parseInt(date.substring(8));
      return date.substring(0,4)===String(y) && m==='05' && d>=1 && d<=5;
    },
  },
  {
    type:'national', icon:'🇨🇳', label:y=>'National Day Golden Week '+y,
    getAnchor: y => y+'-10-01',
    getDates: y => {
      const labels=['National Day (Oct 1) — PH','Oct 2 — PH','Oct 3 — PH',
                    'Oct 4 — PH','Oct 5 — PH','Oct 6 — PH','Oct 7 — PH'];
      const cols=['#f59e0b','#a78bfa','var(--accent)','var(--res)','var(--vis)','#34d399','#f87171'];
      return Array.from({length:7},(_,i)=>({
        date: y+'-10-0'+(i+1),
        label: labels[i], color: cols[i]
      }));
    },
    matchDate: (date, y) => {
      const m=date.substring(5,7),d=parseInt(date.substring(8));
      return date.substring(0,4)===String(y) && m==='10' && d>=1 && d<=7;
    },
  },
  {
    type:'summer', icon:'☀️', label:y=>'Summer Season '+y,
    getAnchor: y => y+'-07-15',
    getDates: y => {
      // Build one entry per week (Mon of each week) Jul 15 - Aug 31
      const dates=[]; let cur=y+'-07-15';
      const end=y+'-08-31';
      const weekLabels=['Week 1','Week 2','Week 3','Week 4','Week 5','Week 6','Week 7'];
      const weekCols=['#f59e0b','#a78bfa','var(--accent)','var(--res)','var(--vis)','#34d399','#f87171'];
      // Get Saturdays and Sundays + weekdays separately
      const sats=[], suns=[], wkds=[];
      let d=cur;
      while(d<=end){
        const dow=new Date(Date.UTC(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8))).getUTCDay();
        if(dow===6) sats.push(d);
        else if(dow===0) suns.push(d);
        else wkds.push(d);
        d=isoAddDays(d,1);
      }
      // Return up to 7 Saturdays (the peak days of summer)
      return sats.slice(0,7).map((s,i)=>({
        date:s,
        label:'Summer Saturday '+(i+1)+' ('+s+')',
        color:weekCols[i]||'var(--accent)'
      }));
    },
    matchDate: (date, y) => {
      const ys=String(y);
      if(date.substring(0,4)!==ys) return false;
      const md=date.substring(5);
      return (md>='07-15'&&md<='07-31')||(md>='08-01'&&md<='08-31');
    },
  },
  {
    type:'christmas', icon:'🎄', label:y=>'Christmas '+y,
    getAnchor: y => y+'-12-25',
    getDates: y => [
      {date:y+'-12-24', label:'Christmas Eve — Non-PH',       color:'#f59e0b'},
      {date:y+'-12-25', label:'Christmas Day — PH',            color:'#a78bfa'},
      {date:y+'-12-26', label:'Boxing Day — PH',               color:'var(--accent)'},
      {date:y+'-12-27', label:'Post-Christmas Day — PH',       color:'var(--res)'},
    ],
    matchDate: (date, y) => {
      const m=date.substring(5,7),d=parseInt(date.substring(8));
      return date.substring(0,4)===String(y) && m==='12' && d>=24 && d<=27;
    },
  },
];

// Get all historical days matching a holiday definition
function getHolidayDays(allDays, holDef){
  const years=[...new Set(allDays.map(d=>+d.date.substring(0,4)))];
  const result=[];
  for(const y of years){
    for(const d of allDays){
      if(holDef.matchDate(d.date, y)) result.push(d);
    }
  }
  return result;
}

// Find the next upcoming holiday from latest loaded date
function detectNextForecastHoliday(days){
  if(!days||!days.length) return null;
  const latest=days[days.length-1].date;
  const latestY=parseInt(latest.substring(0,4));
  let best=null;
  for(const def of HOLIDAY_DEFS){
    for(let yr=latestY; yr<=latestY+2; yr++){
      const anchor=def.getAnchor(yr);
      if(anchor>latest){
        if(!best||anchor<best.anchor){
          best={def, year:yr, anchor, label:def.label(yr), icon:def.icon, type:def.type};
        }
        break;
      }
    }
  }
  return best;
}

// Universal holiday forecast - same methodology as Easter, but for any holiday
function forecastNextHoliday(days){
  const POST_COVID_REOPEN='2023-01-08';
  if(!days||!days.length) return null;

  // 1. Detect next holiday
  const nextHol = detectNextForecastHoliday(days);
  if(!nextHol) return null;

  const {def, year:targetYear} = nextHol;
  const targetDates = def.getDates(targetYear);

  // 2. Collect all historical days for this holiday (post-COVID only for projection)
  const allHolDays = getHolidayDays(days, def);
  const postCovidHolDays = allHolDays.filter(d=>d.date>=POST_COVID_REOPEN);
  const projBase = postCovidHolDays.length>0 ? postCovidHolDays : allHolDays;

  // 3. Growth rate - same OLS method
  const yoy=yoyAnalysis(days);
  let growthRate=0.05, growthMethod='default 5%', dynamicCap=0.20;
  const postCovidYears=yoy.filter(y=>y.year>='2023'&&y.count>=30&&y.avgDaily>0);
  const opYears=postCovidYears.length>0?postCovidYears:yoy.filter(y=>y.count>=30&&y.avgDaily>0&&!isBorderClosed(y.year+'-06-01'));

  // Dynamic cap from holiday-to-holiday YoY
  const holByYear={};
  for(const d of postCovidHolDays){const y=d.date.substring(0,4);if(!holByYear[y])holByYear[y]=[];holByYear[y].push(d);}
  const holYrs=Object.keys(holByYear).filter(y=>holByYear[y].length>=2).sort();
  if(holYrs.length>=2){
    const y1=holYrs[holYrs.length-2],y2=holYrs[holYrs.length-1];
    const t1=holByYear[y1].reduce((s,d)=>s+(d.dt.ad_tot||0),0);
    const t2=holByYear[y2].reduce((s,d)=>s+(d.dt.ad_tot||0),0);
    if(t1>0) dynamicCap=Math.max(0.05,(t2-t1)/t1);
  }

  // Same-period YoY for hourly factor
  let hourlyFactor=1.05;
  const _spYrs=opYears.length>=2?opYears:yoy.filter(y=>y.year>='2023'&&y.count>=30&&y.avgDaily>0);
  if(_spYrs.length>=2){
    const _p=_spYrs[_spYrs.length-2],_l=_spYrs[_spYrs.length-1];
    hourlyFactor=_l.avgDaily/_p.avgDaily;
  }

  let growthCalcSteps=[];
  if(opYears.length>=3){
    const n=opYears.length;
    const xs=opYears.map((_,i)=>i),ys=opYears.map(y=>y.avgDaily);
    const xMean=xs.reduce((a,b)=>a+b,0)/n,yMean=ys.reduce((a,b)=>a+b,0)/n;
    const ssxy=xs.reduce((s,x,i)=>s+(x-xMean)*(ys[i]-yMean),0);
    const ssxx=xs.reduce((s,x)=>s+(x-xMean)**2,0);
    const slope=ssxx>0?ssxy/ssxx:0;
    growthRate=yMean>0?slope/yMean:0.05;
    growthMethod='OLS regression ('+n+' years)';
    growthCalcSteps=[
      'Method: OLS on avg daily across '+n+' post-COVID years',
      'Years: '+opYears.map(y=>y.year+' ('+Number(y.avgDaily).toLocaleString()+')').join(', '),
      'Growth rate: '+(growthRate*100).toFixed(1)+'% → capped at '+(Math.max(-0.10,Math.min(dynamicCap,growthRate))*100).toFixed(1)+'%',
      'Hourly factor: same-period YoY ×'+hourlyFactor.toFixed(3),
      'Historical '+def.label(targetYear-1)+' data: '+postCovidHolDays.filter(d=>d.date.startsWith(String(targetYear-1))).length+' days',
    ];
  } else if(opYears.length===2){
    const r=(opYears[1].avgDaily/opYears[0].avgDaily)-1;
    growthRate=r; growthMethod='CAGR (2 years)';
    growthCalcSteps=['CAGR = '+(r*100).toFixed(1)+'%','Hourly: ×'+hourlyFactor.toFixed(3)];
  }
  growthRate=Math.max(-0.10,Math.min(dynamicCap,growthRate));
  const factor=1+growthRate;

  // 4. Build dayProfiles for each target date
  const mostRecentYear=projBase.length?projBase.reduce((a,b)=>a.date>b.date?a:b).date.substring(0,4):null;
  const dayProfiles={};

  for(const td of targetDates){
    // Find historical matches for same "relative day" in prior years
    // For date-fixed holidays: same month/day-offset
    // For Easter: matched by offset already
    const relOffset = targetDates.indexOf(td); // 0-based day index
    const histMatches = postCovidHolDays.filter(d=>{
      const matchDates=def.getDates(parseInt(d.date.substring(0,4)));
      return matchDates[relOffset] && matchDates[relOffset].date===d.date;
    });
    const recentMatch = mostRecentYear ? histMatches.find(d=>d.date.startsWith(mostRecentYear)) : null;
    const profileDays = histMatches.length>0 ? histMatches : projBase;
    const profile = avgHourlyProfile(profileDays);
    const baselineTotal = recentMatch
      ? (recentMatch.dt.ad_tot||0)
      : (histMatches.length>0
        ? Math.round(histMatches.reduce((s,d)=>s+(d.dt.ad_tot||0),0)/histMatches.length)
        : Math.round(projBase.reduce((s,d)=>s+(d.dt.ad_tot||0),0)/projBase.length));
    const avgTotal = histMatches.length>0
      ? Math.round(histMatches.reduce((s,d)=>s+(d.dt.ad_tot||0),0)/histMatches.length)
      : Math.round(projBase.reduce((s,d)=>s+(d.dt.ad_tot||0),0)/projBase.length);

    dayProfiles[String(relOffset)]={
      ...td,
      profile, avgTotal,
      projTotal: Math.round(baselineTotal*factor),
      baselineTotal, baselineYear: recentMatch?mostRecentYear:'avg',
      histCount: histMatches.length, isEstimated: histMatches.length===0,
      fullYearFactor: hourlyFactor,
    };
  }

  const avgHolTotal = projBase.length
    ? Math.round(projBase.reduce((s,d)=>s+(d.dt.ad_tot||0),0)/projBase.length) : 0;

  return {
    dayProfiles,
    avgEasterTotal: avgHolTotal, // keep field name for compatibility
    growthRate, growthMethod, growthCalcSteps,
    factor, fullYearFactor: hourlyFactor,
    easterDays: allHolDays,      // all historical days for this holiday type
    byOffset: {},
    targetEasterLabel: nextHol.label,
    holidayType: nextHol.type,
    holidayIcon: nextHol.icon,
    projectedTotal: Math.round(avgHolTotal*factor),
    baselineNote: '(post-COVID '+postCovidHolDays.length+' days)',
    postCovidEasterCount: postCovidHolDays.length,
  };
}

  INK:'262626', GREY:'595959', LIGHT:'7F7F7F', RED:'C00000', BLACK:'000000',
  BAND:'F2F2F2', LINE:'D9D9D9', DARK:'8C8C8C',
  FMT:{num:'#,##0', numdash:'#,##0;-#,##0;"\u2014"', pct:'+0.0%;-0.0%;0.0%', share:'0.0%',
       date:'[$-409]dd-mm-yyyy (ddd)', rank:'0'},
  LEFT:{text:1, date:1, time:1, year:1, label:1},
  H:{title:25.5, sub:16.5, spacer:7.5, sec:21.75, hdr:27.75, row:16.5, note:15, gap:12},
  PC_REOPEN:'2023-01-08'
};

function xlFont(sz, bold, color){ return {name:'Arial', sz:sz, bold:!!bold, color:{rgb:color||XL.INK}}; }
function xlFill(rgb){ return {patternType:'solid', fgColor:{rgb:rgb}}; }
function xlLine(rgb){ return {style:'thin', color:{rgb:rgb}}; }
// Excel date serial from 'YYYY-MM-DD' (UTC arithmetic, timezone-safe)
function xlSerial(iso){
  const p = iso.split('-');
  return Math.round((Date.UTC(+p[0], +p[1]-1, +p[2]) - Date.UTC(1899, 11, 30)) / 86400000);
}
function xlCol(c){ return XLSX.utils.encode_col(c-1); }
function xlTime(t){ return String(t||'').replace('\u2605', '').trim().replace(/\s*[-\u2013]\s*/g, '\u2013'); }
function xlWidth(texts, lo, hi){
  const n = texts.reduce(function(m, t){ return Math.max(m, String(t||'').length); }, 10);
  return Math.max(lo||18, Math.min(hi||60, Math.round(n*0.9)+4));
}
function xlUnique(arr){ return arr.filter(function(x, i){ return arr.indexOf(x)===i; }); }
function xlYears(ys){
  ys = xlUnique(ys).sort();
  if(ys.length<2) return ys[0]||'';
  const run = ys.every(function(y, i){ return i===0 || +y===+ys[i-1]+1; });
  return run ? ys[0]+'\u2013'+ys[ys.length-1] : ys.join(', ');
}
function xlEsc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// Total cell: live formula when the parts add up to the stored total; otherwise the
// stored total itself, so the figure shown is always the one used for ranking.
function xlSum(total, parts, formulaFn){
  return function(rr){
    const s = parts.reduce(function(a, b){ return a+(b||0); }, 0);
    return (total===null || total===undefined || s===total) ? {f:formulaFn(rr), v:s} : total;
  };
}

// Sheet writer. Rows are 1-based and every row gets an explicit height (used for paging).
function xlSheet(name, title, scope, theme){
  const sh = {name:name, theme:theme, ws:{}, hts:[], r:1, maxC:1, blocks:[1], hdrRow:null, colW:[], print:null};
  sh.put = function(r, c, cell){
    sh.ws[XLSX.utils.encode_cell({r:r-1, c:c-1})] = cell;
    if(c>sh.maxC) sh.maxC = c;
  };
  sh.get = function(r, c){
    const x = sh.ws[XLSX.utils.encode_cell({r:r-1, c:c-1})];
    return x ? x.v : null;
  };
  sh.gap = function(h){ sh.hts[sh.r] = h||XL.H.gap; sh.r++; };
  sh.newBlock = function(){ if(sh.blocks[sh.blocks.length-1]!==sh.r) sh.blocks.push(sh.r); };
  sh.section = function(text){
    sh.newBlock();
    sh.put(sh.r, 1, {t:'s', v:text, s:{font:xlFont(11, true, theme.main), alignment:{vertical:'bottom'}}});
    sh.hts[sh.r] = XL.H.sec; sh.r++;
  };
  sh.note = function(text){
    sh.put(sh.r, 1, {t:'s', v:text, s:{font:xlFont(9, false, XL.LIGHT)}});
    sh.hts[sh.r] = XL.H.note; sh.r++;
  };
  // cols: [label, kind, isKey]. box: outline the header in black (Summary style)
  sh.header = function(cols, box){
    cols.forEach(function(col, j){
      const kind = col[1];
      const h = XL.LEFT[kind] ? 'left' : (kind==='rank' ? 'center' : 'right');
      const s = {font:xlFont(10, true, 'FFFFFF'), fill:xlFill(theme.main),
                 alignment:{horizontal:h, vertical:'center', wrapText:true, indent:h==='center'?0:1}};
      if(box){
        s.border = {top:xlLine(XL.BLACK)};
        if(j===0) s.border.left = xlLine(XL.BLACK);
        if(j===cols.length-1) s.border.right = xlLine(XL.BLACK);
      }
      sh.put(sh.r, j+1, {t:'s', v:col[0], s:s});
    });
    sh.hts[sh.r] = XL.H.hdr; sh.hdrRow = sh.r; sh.r++;
  };
  // values: plain value, {f,v} formula, or function(row) returning either.
  // opts: bold, boldCols, muted, fill ('' = none), color {colIndex: rgb},
  //       border: 'top' (total row) or function(colIndex, nCols) returning a border object
  sh.row = function(cols, values, opts){
    opts = opts || {};
    const rr = sh.r;
    cols.forEach(function(col, j){
      const kind = col[1], key = col[2];
      let v = values[j];
      if(typeof v==='function') v = v(rr);
      let cell;
      if(v!==null && typeof v==='object' && v.f!==undefined){
        cell = {t:(typeof v.v==='string' ? 's' : 'n'), f:v.f, v:v.v};
      } else if(kind==='date' && typeof v==='string' && /^\d{4}-\d{2}-\d{2}$/.test(v)){
        cell = {t:'n', v:xlSerial(v)};
      } else if(typeof v==='number'){
        cell = {t:'n', v:v};
      } else {
        cell = {t:'s', v:(v===null || v===undefined) ? '' : String(v)};
      }
      let color = opts.muted ? XL.LIGHT : XL.INK;
      if(opts.color && opts.color[j]) color = opts.color[j];
      if(kind==='pct' && typeof cell.v==='number' && cell.v<0) color = XL.RED;
      const bold = opts.bold || (key && kind!=='text') || (opts.boldCols && opts.boldCols.indexOf(j)>=0);
      const h = XL.LEFT[kind] ? 'left' : (kind==='rank' ? 'center' : 'right');
      let border;
      if(typeof opts.border==='function') border = opts.border(j, cols.length);
      else if(opts.border==='top') border = {top:xlLine(XL.DARK), bottom:xlLine(XL.LINE)};
      else border = {bottom:xlLine(XL.LINE)};
      const s = {font:xlFont(10, bold, color), alignment:{horizontal:h, vertical:'center', indent:h==='center'?0:1}, border:border};
      if(XL.FMT[kind]) s.numFmt = XL.FMT[kind];
      const fill = (opts.fill!==undefined) ? opts.fill : (key ? theme.key : '');
      if(fill) s.fill = xlFill(fill);
      cell.s = s;
      sh.put(rr, j+1, cell);
    });
    sh.hts[rr] = XL.H.row;
    sh.r++;
    return rr;
  };
  sh.widths = function(w){ sh.colW = w; };
  sh.finish = function(footerLeft, titleRow, freezeRow){
    const lastRow = sh.r-1;
    const plan = xlPaginate(sh, lastRow, titleRow);
    sh.ws['!ref'] = 'A1:'+XLSX.utils.encode_cell({r:lastRow-1, c:sh.maxC-1});
    sh.ws['!cols'] = sh.colW.map(function(w){ return {width:w}; });
    const rows = [];
    for(let r=1; r<=lastRow; r++) rows[r-1] = {hpt:sh.hts[r]||15};
    sh.ws['!rows'] = rows;
    sh.print = {orient:plan.orient, scale:plan.scale, breaks:plan.breaks, pages:plan.pages,
                footerLeft:footerLeft, titleRow:titleRow||null, freezeRow:freezeRow||null};
  };
  sh.put(1, 1, {t:'s', v:title, s:{font:xlFont(15, true, theme.main)}});
  sh.hts[1] = XL.H.title;
  sh.put(2, 1, {t:'s', v:scope, s:{font:xlFont(10, false, XL.GREY)}});
  sh.hts[2] = XL.H.sub;
  sh.r = 3;
  sh.gap(XL.H.spacer);
  return sh;
}

// A4 print plan: portrait or landscape, scale 100% down to 75%, page breaks only between
// blocks (a block = section title + its table); fewest pages first, then largest scale.
function xlPaginate(sh, lastRow, titleRow){
  let widthPt = 0;
  for(let j=1; j<=sh.maxC; j++){ const w = sh.colW[j-1] || 8.43; widthPt += (w*7+5)*0.75; }
  const ht = function(r){ return sh.hts[r] || 15; };
  const starts = sh.blocks.filter(function(b){ return b<=lastRow; }).concat([lastRow+1]);
  const spans = [];
  for(let i=0; i<starts.length-1; i++){
    let h = 0;
    for(let r=starts[i]; r<starts[i+1]; r++) h += ht(r);
    spans.push({a:starts[i], h:h});
  }
  const repH = titleRow ? ht(titleRow) : 0;
  function pack(avail){
    const br = []; let used = 0;
    spans.forEach(function(sp){
      if(used && used+sp.h>avail){ br.push(sp.a-1); used = repH; }
      used += sp.h;
    });
    return br;
  }
  const MIN = 0.75, options = [];
  [['portrait', 537, 763], ['landscape', 784, 516]].forEach(function(o){
    const wscale = Math.min(1, o[1]*0.97/widthPt);
    if(wscale<MIN) return;
    let best = null;
    for(let k=0; ; k++){
      const sc = wscale-k*0.01;
      if(sc<MIN-1e-9) break;
      const br = pack(o[2]*0.97/sc);
      if(!best || br.length+1<best.pages) best = {pages:br.length+1, sc:sc, br:br};
    }
    options.push({pages:best.pages, sc:best.sc, orient:o[0], breaks:best.br});
  });
  if(!options.length){
    const sc = 784*0.97/widthPt;
    options.push({pages:0, sc:sc, orient:'landscape', breaks:pack(516*0.97/sc)});
  }
  options.sort(function(a, b){ return (a.pages-b.pages) || (b.sc-a.sc) || (a.orient<b.orient ? -1 : 1); });
  const best = options[0];
  return {orient:best.orient, scale:Math.max(10, Math.floor(best.sc*100+1e-6)), breaks:best.breaks, pages:best.pages};
}

// Adds what the xlsx library cannot write itself: hidden gridlines, frozen header,
// A4 page setup, centred printing, footer and page breaks.
function xlPatchWorkbook(bytes, sheets){
  const CFB = XLSX.CFB;
  const zip = CFB.read(new Uint8Array(bytes), {type:'array'});
  const dec = new TextDecoder('utf-8'), enc = new TextEncoder();
  sheets.forEach(function(sh, i){
    const entry = CFB.find(zip, '/xl/worksheets/sheet'+(i+1)+'.xml');
    if(!entry) throw new Error('Missing sheet '+(i+1));
    const raw = entry.content;
    let xml = dec.decode(raw instanceof Uint8Array ? raw : new Uint8Array(raw));
    const p = sh.print;
    let view = '<sheetView showGridLines="0"'+(i===0 ? ' tabSelected="1"' : '')+' workbookViewId="0"';
    if(p.freezeRow){
      const top = 'A'+(p.freezeRow+1);
      view += '><pane ySplit="'+p.freezeRow+'" topLeftCell="'+top+'" activePane="bottomLeft" state="frozen"/>'+
              '<selection pane="bottomLeft" activeCell="'+top+'" sqref="'+top+'"/></sheetView>';
    } else {
      view += '/>';
    }
    if(/<sheetViews>[\s\S]*?<\/sheetViews>/.test(xml)) xml = xml.replace(/<sheetViews>[\s\S]*?<\/sheetViews>/, '<sheetViews>'+view+'</sheetViews>');
    else xml = xml.replace(/(<dimension[^>]*\/>)/, '$1<sheetViews>'+view+'</sheetViews>');
    xml = xml.replace(/<pageMargins[^>]*\/>/, '');
    const foot = '&amp;L&amp;"Arial,Regular"&amp;8'+xlEsc(p.footerLeft)+'&amp;R&amp;"Arial,Regular"&amp;8Page &amp;P of &amp;N';
    let tail = '<printOptions horizontalCentered="1"/>'+
      '<pageMargins left="0.4" right="0.4" top="0.5" bottom="0.6" header="0.2" footer="0.3"/>'+
      '<pageSetup paperSize="9" scale="'+p.scale+'" orientation="'+p.orient+'"/>'+
      '<headerFooter><oddFooter>'+foot+'</oddFooter></headerFooter>';
    if(p.breaks.length){
      tail += '<rowBreaks count="'+p.breaks.length+'" manualBreakCount="'+p.breaks.length+'">'+
        p.breaks.map(function(b){ return '<brk id="'+b+'" max="16383" man="1"/>'; }).join('')+'</rowBreaks>';
    }
    const m = xml.match(/<(ignoredErrors|drawing|legacyDrawing|tableParts|extLst)[\s>\/]/);
    xml = m ? xml.slice(0, m.index)+tail+xml.slice(m.index) : xml.replace('</worksheet>', tail+'</worksheet>');
    const u8 = enc.encode(xml);
    entry.content = u8; entry.size = u8.length;
  });
  const out = CFB.write(zip, {fileType:'zip', type:'array', compression:true});
  return (out instanceof Uint8Array) ? out : new Uint8Array(out);
}

// Average by day of week over the last 12 months up to the latest date
function dowLast12(days, asat){
  const p = asat.split('-');
  const from = new Date(Date.UTC(+p[0]-1, +p[1]-1, +p[2]+1)).toISOString().slice(0, 10);
  const src = days.filter(function(d){ return d.date>=from && d.date<=asat && !isBorderClosed(d.date); });
  const names = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const order = [1,2,3,4,5,6,0];
  const b = names.map(function(n){ return {day:n, t:[], a:[], d:[]}; });
  src.forEach(function(d){
    const js = new Date(Date.UTC(+d.date.slice(0, 4), +d.date.slice(5, 7)-1, +d.date.slice(8, 10))).getUTCDay();
    const k = order.indexOf(js);
    b[k].t.push(d.dt.ad_tot||0); b[k].a.push(d.dt.arr_tot||0); b[k].d.push(d.dt.dep_tot||0);
  });
  const avg = function(a){ return a.length ? Math.round(a.reduce(function(s, x){ return s+x; }, 0)/a.length) : 0; };
  return b.map(function(x){ return {day:x.day, avg:avg(x.t), avgArr:avg(x.a), avgDep:avg(x.d), n:x.t.length}; });
}

const HISTORY_SHEET = {easter:'Easter History', labour:'Golden Week History', national:'Golden Week History',
                       summer:'Summer History', christmas:'Christmas History'};

// Builds one report. eraKey: 'postcovid' | 'since'
function buildReport(eraKey){
  const isPC = eraKey==='postcovid';
  const T = XL.THEME[eraKey];
  const days = allDays.filter(function(d){ return d.date>=(isPC ? POST_COVID_DATE : COMM_DATE); });
  if(!days.length) return null;
  const era = isPC ? 'Post-COVID' : 'Since Commissioning';
  const first = days[0].date, asat = days[days.length-1].date;
  const opDays = days.filter(function(d){ return !isBorderClosed(d.date); }).length;
  const scope = 'LSC Passenger Statistics   |   '+fDate(first)+' to '+fDate(asat)+'   |   '+
                opDays.toLocaleString('en-US')+' operational days';
  const footer = 'LSC Passenger Statistics \u2014 Record High ('+era+') \u2014 as at '+fDate(asat);
  const refs = {};
  const n0 = function(k){ return function(o){ return o[k]||0; }; };

  // --- Daily record sheets -------------------------------------------------------
  function dailySheet(name, title, tables){
    const sh = xlSheet(name, title+' ('+era+')', scope, T);
    const occs = []; let ncols = 3;
    tables.forEach(function(t){
      sh.section(t.title);
      const cols = [['Rank','rank',false], ['Date','date',false], ['Event','text',false]]
        .concat(t.cols.map(function(c){ return [c[0], 'num', c[0]===t.key]; }));
      ncols = Math.max(ncols, cols.length);
      sh.header(cols);
      let firstRow = null;
      t.items.forEach(function(x, i){
        const occ = getRemarks(x.day.date) || '';
        occs.push(occ);
        const vals = [i+1, x.day.date, occ].concat(t.cols.map(function(c){ return c[1](x.day.dt); }));
        const rr = sh.row(cols, vals, {bold:i===0});
        if(firstRow===null) firstRow = rr;
      });
      if(firstRow!==null){
        refs[t.ref] = {sheet:sh, row:firstRow, col:cols.findIndex(function(c){ return c[2]; })+1, dateCol:2, timeCol:null, occCol:3};
      }
      sh.gap();
    });
    sh.r--;  // no gap after the last table
    const w = [7, 17, xlWidth(occs)];
    for(let k=3; k<ncols; k++) w.push(13);
    sh.widths(w);
    sh.finish(footer);
    return sh;
  }
  const ttl = dailySheet('Total Traffic', 'Record High \u2014 Total Traffic', [
    {title:'Record High on Total Passenger Traffic', key:'Total', ref:'d_total',
     items:topN(days, function(d){ return d.dt.ad_tot; }),
     cols:[['Arrival HKR', n0('arr_res')], ['Arrival Visitors', n0('arr_vis')],
           ['Departure HKR', n0('dep_res')], ['Departure Visitors', n0('dep_vis')],
           ['Total', function(dt){ return xlSum(dt.ad_tot, [dt.arr_res, dt.arr_vis, dt.dep_res, dt.dep_vis],
              function(rr){ return 'SUM(D'+rr+':G'+rr+')'; }); }]]},
    {title:'Record High on Arrival Passengers', key:'Total', ref:'d_arr',
     items:topN(days, function(d){ return d.dt.arr_tot; }),
     cols:[['HKR', n0('arr_res')], ['Visitors', n0('arr_vis')],
           ['Total', function(dt){ return xlSum(dt.arr_tot, [dt.arr_res, dt.arr_vis], function(rr){ return 'D'+rr+'+E'+rr; }); }]]},
    {title:'Record High on Departure Passengers', key:'Total', ref:'d_dep',
     items:topN(days, function(d){ return d.dt.dep_tot; }),
     cols:[['HKR', n0('dep_res')], ['Visitors', n0('dep_vis')],
           ['Total', function(dt){ return xlSum(dt.dep_tot, [dt.dep_res, dt.dep_vis], function(rr){ return 'D'+rr+'+E'+rr; }); }]]}
  ]);
  const pairCols = function(a, b, la, lb, lt){
    return [[la, n0(a)], [lb, n0(b)],
            [lt, function(dt){ return xlSum(null, [dt[a], dt[b]], function(rr){ return 'D'+rr+'+E'+rr; }); }]];
  };
  const hkrCols = pairCols('arr_res', 'dep_res', 'Arrival HKR', 'Departure HKR', 'Total HKR');
  const hkr = dailySheet('HKR', 'Record High \u2014 HKR (Residents)', [
    {title:'Record High on Total Number of HKR', key:'Total HKR', ref:'d_hkr_total', cols:hkrCols,
     items:topN(days, function(d){ return (d.dt.arr_res||0)+(d.dt.dep_res||0); })},
    {title:'Record High on Arrival HKR', key:'Arrival HKR', ref:'d_hkr_arr', cols:hkrCols,
     items:topN(days, function(d){ return d.dt.arr_res; })},
    {title:'Record High on Departure HKR', key:'Departure HKR', ref:'d_hkr_dep', cols:hkrCols,
     items:topN(days, function(d){ return d.dt.dep_res; })}
  ]);
  const visCols = pairCols('arr_vis', 'dep_vis', 'Arrival Visitors', 'Departure Visitors', 'Total Visitors');
  const vis = dailySheet('Visitor', 'Record High \u2014 Visitors', [
    {title:'Record High on Total Number of Visitors', key:'Total Visitors', ref:'d_vis_total', cols:visCols,
     items:topN(days, function(d){ return (d.dt.arr_vis||0)+(d.dt.dep_vis||0); })},
    {title:'Record High on Arrival Visitors', key:'Arrival Visitors', ref:'d_vis_arr', cols:visCols,
     items:topN(days, function(d){ return d.dt.arr_vis; })},
    {title:'Record High on Departure Visitors', key:'Departure Visitors', ref:'d_vis_dep', cols:visCols,
     items:topN(days, function(d){ return d.dt.dep_vis; })}
  ]);

  // --- Hourly record sheet -------------------------------------------------------
  const hr = xlSheet('Hourly', 'Record High \u2014 Hourly ('+era+')', scope, T);
  const HCOLS = [
    ['Arrival HKR', n0('arr_res')], ['Arrival Visitors', n0('arr_vis')],
    ['Arrival Total', function(h){ return xlSum(h.arr_tot, [h.arr_res, h.arr_vis], function(rr){ return 'E'+rr+'+F'+rr; }); }],
    ['Departure HKR', n0('dep_res')], ['Departure Visitors', n0('dep_vis')],
    ['Departure Total', function(h){ return xlSum(h.dep_tot, [h.dep_res, h.dep_vis], function(rr){ return 'H'+rr+'+I'+rr; }); }],
    ['Total', function(h){ return xlSum(null, [h.arr_tot, h.dep_tot], function(rr){ return 'G'+rr+'+J'+rr; }); }]
  ];
  const hOccs = [];
  [['Hourly Record High on Total Passengers', 'Total', 'h_total', function(h){ return (h.arr_tot||0)+(h.dep_tot||0); }],
   ['Hourly Record High on Arrival Passengers', 'Arrival Total', 'h_arr', function(h){ return h.arr_tot; }],
   ['Hourly Record High on Departure Passengers', 'Departure Total', 'h_dep', function(h){ return h.dep_tot; }],
   ['Hourly Record High on Arrival HKR', 'Arrival HKR', 'h_hkr_arr', function(h){ return h.arr_res; }],
   ['Hourly Record High on Departure HKR', 'Departure HKR', 'h_hkr_dep', function(h){ return h.dep_res; }],
   ['Hourly Record High on Arrival Visitors', 'Arrival Visitors', 'h_vis_arr', function(h){ return h.arr_vis; }],
   ['Hourly Record High on Departure Visitors', 'Departure Visitors', 'h_vis_dep', function(h){ return h.dep_vis; }]
  ].forEach(function(t){
    hr.section(t[0]);
    const cols = [['Rank','rank',false], ['Date','date',false], ['Time','time',false], ['Event','text',false]]
      .concat(HCOLS.map(function(c){ return [c[0], 'num', c[0]===t[1]]; }));
    hr.header(cols);
    let firstRow = null;
    topNHourly(days, t[3]).forEach(function(x, i){
      const occ = getRemarks(x.day.date) || '';
      hOccs.push(occ);
      const vals = [i+1, x.day.date, xlTime(x.hr.time), occ].concat(HCOLS.map(function(c){ return c[1](x.hr); }));
      const rr = hr.row(cols, vals, {bold:i===0});
      if(firstRow===null) firstRow = rr;
    });
    if(firstRow!==null){
      refs[t[2]] = {sheet:hr, row:firstRow, col:cols.findIndex(function(c){ return c[2]; })+1, dateCol:2, timeCol:3, occCol:4};
    }
    hr.gap();
  });
  hr.r--;
  hr.widths([7, 17, 12, xlWidth(hOccs), 12, 12, 12, 12, 12, 12, 12]);
  hr.finish(footer);

  // --- Analysis sheet --------------------------------------------------------------
  const an = xlSheet('Analysis', 'Traffic Analysis ('+era+')', scope, T);
  const yoy = yoyAnalysis(days);
  const fy = fullYearAnalysis(days);
  // Border-closure days (zero traffic) would drag these averages down, as the YoY tables already exclude them
  const opList = days.filter(function(d){ return !isBorderClosed(d.date); });
  const ww = weekdayWeekendAnalysis(opList);
  const holidays = holidayAnalysis(opList);
  const dow = dowLast12(days, asat);
  const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const periodLabel = parseInt(asat.slice(8, 10), 10)+' '+MON[parseInt(asat.slice(5, 7), 10)-1];
  const yrNow = asat.slice(0, 4);
  const avgF = function(rr){ return 'IF(B'+rr+'=0,"\u2014",D'+rr+'/B'+rr+')'; };
  const growF = function(rr){ return 'IF(OR(B'+rr+'=0,B'+(rr-1)+'=0),"\u2014",E'+rr+'/E'+(rr-1)+'-1)'; };
  function trendRows(list, cols, withVis, labelFn){
    list.forEach(function(y, i){
      const prev = i>0 ? list[i-1] : null;
      const avg = y.count ? y.total/y.count : '\u2014';
      const grow = (y.count && prev && prev.count) ? (y.total/y.count)/(prev.total/prev.count)-1 : '\u2014';
      const vals = [labelFn(y), y.count, y.closedDays||0,
        xlSum(y.total, [y.arr, y.dep], function(rr){ return 'G'+rr+'+H'+rr; }),
        function(rr){ return {f:avgF(rr), v:avg}; },
        prev ? function(rr){ return {f:growF(rr), v:grow}; } : '\u2014',
        y.arr, y.dep, y.res];
      if(withVis) vals.push(y.vis);
      an.row(cols, vals, {bold:y.year===yrNow, muted:y.count===0});
    });
  }
  an.section('Year-on-Year Trend \u2014 Same Period Each Year (1 Jan \u2013 '+periodLabel+')');
  const colsY = [['Year','year',false], ['Op. Days','num',false], ['Closed Days','numdash',false],
    ['Total','numdash',false], ['Avg Daily','numdash',true], ['YoY Growth','pct',true],
    ['Arrival','numdash',false], ['Departure','numdash',false], ['HKR','numdash',false], ['Visitors','numdash',false]];
  an.header(colsY);
  trendRows(yoy, colsY, true, function(y){ return y.year; });
  an.note('Avg Daily = Total \u00f7 Op. Days (border-closure days excluded).   YoY Growth = change in Avg Daily against the previous year.');
  if(yoy.some(function(y){ return y.caveat==='early-reopen'; })){
    an.note('2023: border reopened on 8 Jan 2023 and traffic ramped up gradually \u2014 2023 is a low base, so 2024 growth is overstated.');
  }
  const closedYrs = yoy.filter(function(y){ return y.count===0; }).map(function(y){ return y.year; });
  if(closedYrs.length){
    an.note(xlYears(closedYrs)+': border closed (COVID-19); no Avg Daily or YoY Growth for '+(closedYrs.length>1 ? 'these years.' : 'this year.'));
  }
  an.gap();

  an.section('Annual Traffic \u2014 Full Year');
  const colsA = colsY.slice(0, 9);
  an.header(colsA);
  trendRows(fy, colsA, false, function(y){ return y.isPartial ? y.year+' YTD' : y.year; });
  if(fy.length && fy[fy.length-1].isPartial){
    an.note(yrNow+' YTD = 1 Jan \u2013 '+periodLabel+' '+yrNow+' (in progress).  Its Avg Daily is comparable with full years because it is a per-day figure.');
  }
  an.gap();

  an.section('Weekday vs Weekend / Public Holiday');
  const colsB = [['Category','label',false], ['Days','num',false], ['Avg Total','num',true],
    ['Avg Arrival','num',false], ['Avg Departure','num',false], ['Avg HKR','num',false],
    ['Avg Visitors','num',false], ['HKR %','share',false], ['Visitor %','share',false]];
  an.header(colsB);
  const shareF = function(col, part, tot){
    return function(rr){ return {f:'IF(C'+rr+'=0,"\u2014",'+col+rr+'/C'+rr+')', v:tot ? part/tot : '\u2014'}; };
  };
  const bench = {};
  [['wk', 'Weekday (non-PH)', ww.weekday], ['we', 'Weekend / Public Holiday', ww.phwk]].forEach(function(b){
    const d = b[2];
    bench[b[0]] = {avg:d.avgTotal, row:an.row(colsB, [b[1], d.count, d.avgTotal, d.avgArr, d.avgDep, d.avgRes||0, d.avgVis||0,
      shareF('F', d.avgRes||0, d.avgTotal), shareF('G', d.avgVis||0, d.avgTotal)])};
  });
  an.gap();

  an.section('Average Traffic by Holiday / Day Type');
  const colsT = [['Holiday / Day Type','label',false], ['Occurrences','num',false], ['Avg Total','num',true],
    ['Avg Arrival','num',false], ['Avg Departure','num',false], ['Avg HKR','num',false],
    ['Avg Visitors','num',false], ['Peak Recorded','num',false]];
  an.header(colsT);
  holidays.forEach(function(h){
    an.row(colsT, [h.cat, h.count, h.avg, h.avgArr, h.avgDep, h.avgRes||0, h.avgVis||0, h.max]);
  });
  an.note('Sorted by Avg Total (highest first).  Peak Recorded = highest single-day total for that type.');
  an.gap();

  an.section('Average Traffic by Day of Week (Last 12 months)');
  const colsW = [['Day','label',false], ['Avg Total','num',true], ['Avg Arrival','num',false],
    ['Avg Departure','num',false], ['vs Monday','pct',false]];
  an.header(colsW);
  const dowFirst = an.r;
  const monAvg = dow[0].avg;
  dow.forEach(function(d){
    an.row(colsW, [d.day, d.avg, d.avgArr, d.avgDep,
      function(rr){ return {f:'IF($B$'+dowFirst+'=0,"\u2014",B'+rr+'/$B$'+dowFirst+'-1)', v:monAvg ? d.avg/monAvg-1 : '\u2014'}; }],
      {bold:d.day==='Sat' || d.day==='Sun'});
  });
  const labels = holidays.map(function(h){ return h.cat; }).concat(['Weekend / Public Holiday', 'Year']);
  an.widths([Math.max(22, xlWidth(labels, 18, 40)), 13, 13, 13, 13, 13, 13, 13, 13, 13]);
  an.finish(footer);

  // --- Forecast and holiday history ---------------------------------------------------
  const f = forecastNextHoliday(days);
  let fc = null, hist = null;
  if(f){
    const holName = f.targetEasterLabel || 'Holiday';
    const holShort = holName.replace(/\s+\d{4}$/, '');
    fc = xlSheet('Forecast', 'Forecast \u2014 '+holName+' ('+era+')', scope, T);
    const profiles = Object.keys(f.dayProfiles).sort(function(a, b){ return +a-+b; })
      .map(function(k){ return f.dayProfiles[k]; });
    const gr = f.growthRate || 0;
    const bYears = xlUnique(profiles.map(function(dp){ return dp.baselineYear; }));
    const bLabel = (bYears.length===1 && bYears[0]!=='avg') ? bYears[0]+' actual' : 'Latest actual (Hist. Avg where none)';
    const same = (f.holidayType==='easter' || f.holidayType==='summer') ? 'same holiday day' : 'same date';
    const pcYears = f.easterDays.filter(function(d){ return d.date>=XL.PC_REOPEN && (d.dt.ad_tot||0)>0; })
      .map(function(d){ return d.date.slice(0, 4); });
    fc.note('Method: '+f.growthMethod+', growth rate '+(gr>=0 ? '+' : '')+(gr*100).toFixed(1)+'%.');
    fc.note('Proj. Total = '+bLabel+' on the '+same+' \u00d7 '+f.factor.toFixed(3)+'.');
    if(pcYears.length) fc.note('Hist. Avg = average of the '+same+' in '+xlYears(pcYears)+' (post-COVID).');
    fc.gap(XL.H.spacer);

    fc.section('Daily Forecast');
    const colsF = [['Date','date',false], ['Occasion','text',false], ['Hist. Avg','num',false],
      ['Proj. Arrival','num',false], ['Proj. Departure','num',false], ['Proj. Total','num',true],
      ['vs Avg Weekday','pct',false], ['vs Avg Weekend / PH','pct',false]];
    fc.header(colsF);
    const maxProj = profiles.reduce(function(m, dp){ return Math.max(m, dp.projTotal||0); }, 0);
    const occOf = function(dp){ return String(dp.label||'').replace(/ \(.*\)/, ''); };
    const vsF = function(b, proj){
      return function(rr){
        return {f:"IF(Analysis!$C$"+b.row+"=0,\"\u2014\",F"+rr+"/Analysis!$C$"+b.row+"-1)", v:b.avg ? proj/b.avg-1 : '\u2014'};
      };
    };
    profiles.forEach(function(dp){
      const sumArr = dp.profile.reduce(function(s, h){ return s+(h.arr_tot||0); }, 0);
      const sumTot = dp.profile.reduce(function(s, h){ return s+(h.ad_tot||0); }, 0) || 1;
      const projArr = Math.round(dp.projTotal*(sumArr/sumTot));
      const projDep = dp.projTotal-projArr;
      fc.row(colsF, [dp.date, occOf(dp), dp.avgTotal, projArr, projDep,
        function(rr){ return {f:'D'+rr+'+E'+rr, v:projArr+projDep}; },
        vsF(bench.wk, dp.projTotal), vsF(bench.we, dp.projTotal)], {bold:dp.projTotal===maxProj});
    });
    fc.note("Bold = busiest projected day.  'vs Avg Weekday / Weekend' compare Proj. Total with the averages on the Analysis sheet.");
    const hf = f.fullYearFactor || f.factor;
    if(Math.abs(hf-f.factor)>0.0005){
      fc.note('Hourly tables use '+bLabel+' \u00d7 '+hf.toFixed(3)+' (same-period YoY growth), so their day totals differ from Proj. Total.');
    }

    const colsH = [['Time','time',false], ['Hist. Avg','num',false], ['Proj. Arrival','num',false],
      ['Proj. Departure','num',false], ['Proj. Total','num',true]];
    profiles.forEach(function(dp){
      const hrs = dp.profile.filter(function(h){ return /^\d{4}/.test(h.time||''); });
      if(!hrs.length) return;
      const peak = hrs.reduce(function(a, b){ return (b.ad_tot||0)>(a.ad_tot||0) ? b : a; }, hrs[0]);
      const sumHist = hrs.reduce(function(s, h){ return s+(h.ad_tot||0); }, 0) || 1;
      fc.gap();
      fc.section('Hourly Projection \u2014 '+fDate(dp.date)+' ('+dayOfWeek(dp.date)+')   \u00b7   '+occOf(dp));
      fc.header(colsH);
      const g1 = fc.r;
      hrs.forEach(function(h){
        const histT = h.ad_tot||0;
        const projTot = Math.round(dp.baselineTotal*hf*(histT/sumHist));
        const projArr = Math.round(projTot*((h.arr_tot||0)/(histT||1)));
        const projDep = projTot-projArr;
        const isPk = h.time===peak.time;
        fc.row(colsH, [xlTime(h.time)+(isPk ? '  (peak)' : ''), histT, projArr, projDep,
          function(rr){ return {f:'C'+rr+'+D'+rr, v:projArr+projDep}; }], {bold:isPk});
      });
      const g2 = fc.r-1;
      const sumCol = function(c){
        let s = 0;
        for(let r=g1; r<=g2; r++) s += fc.get(r, c)||0;
        return {f:'SUM('+xlCol(c)+g1+':'+xlCol(c)+g2+')', v:s};
      };
      fc.row(colsH, ['Day total', sumCol(2), sumCol(3), sumCol(4), sumCol(5)], {bold:true, border:'top'});
    });
    fc.widths([19, Math.max(19, xlWidth(profiles.map(occOf))), 13, 13, 13, 13, 14, 14]);
    fc.finish(footer);

    // Every past day of this holiday in the era (days with no traffic are left out)
    const all = f.easterDays.slice().sort(function(a, b){ return a.date.localeCompare(b.date); });
    const noTraffic = function(d){ return !(d.dt.ad_tot||0) && !(d.dt.arr_tot||0) && !(d.dt.dep_tot||0); };
    const kept = all.filter(function(d){ return !noTraffic(d); });
    const dropped = all.filter(noTraffic);
    hist = xlSheet(HISTORY_SHEET[f.holidayType] || 'Holiday History', holShort+' \u2014 Historical Actuals ('+era+')', scope, T);
    const colsG = [['Date','date',false], ['Occasion','text',false], ['Arrival HKR','num',false],
      ['Arrival Visitors','num',false], ['Arrival','num',false], ['Departure HKR','num',false],
      ['Departure Visitors','num',false], ['Departure','num',false], ['Total','num',false]];
    hist.header(colsG);
    const hdrRow = hist.hdrRow;
    const years = [], gOccs = [];
    kept.forEach(function(d){
      const y = d.date.slice(0, 4);
      if(years.indexOf(y)<0){ years.push(y); if(years.length>1) hist.newBlock(); }
      const jsDay = new Date(Date.UTC(+d.date.slice(0, 4), +d.date.slice(5, 7)-1, +d.date.slice(8, 10))).getUTCDay();
      const isPH = !!HK_GAZETTE_PH[d.date] || jsDay===0;
      const occ = (getRemarks(d.date) || '\u2014')+(isPH ? ' \u2014 PH' : ' \u2014 Non-PH');
      gOccs.push(occ);
      const t = d.dt;
      hist.row(colsG, [d.date, occ, t.arr_res||0, t.arr_vis||0,
        xlSum(t.arr_tot, [t.arr_res, t.arr_vis], function(rr){ return 'C'+rr+'+D'+rr; }),
        t.dep_res||0, t.dep_vis||0,
        xlSum(t.dep_tot, [t.dep_res, t.dep_vis], function(rr){ return 'F'+rr+'+G'+rr; }),
        xlSum(t.ad_tot, [t.arr_tot, t.dep_tot], function(rr){ return 'E'+rr+'+H'+rr; })],
        {fill:(years.length%2===0) ? XL.BAND : '', boldCols:[8]});
    });
    if(dropped.length){
      const allClosed = dropped.every(function(d){ return isBorderClosed(d.date); });
      hist.note(allClosed ? xlYears(dropped.map(function(d){ return d.date.slice(0, 4); }))+' not shown: border closed (COVID-19), no traffic.'
                          : dropped.length+' day(s) with no recorded traffic are not shown.');
    }
    hist.widths([17, xlWidth(gOccs), 13, 13, 13, 13, 13, 13, 13]);
    hist.finish(footer, hdrRow, hdrRow);
  }

  // --- Summary (first tab): links to the No. 1 row of each category, boxed by group ---
  const sm = xlSheet('Summary', 'Record High \u2014 Summary ('+era+')', scope, T);
  const colsS = [['Category','label',false], ['Record','num',true], ['Date','date',false],
    ['Time','time',false], ['Event','text',false]];
  const link = function(ref, c, asText){
    const a = "'"+ref.sheet.name+"'!"+xlCol(c)+ref.row;
    const v = ref.sheet.get(ref.row, c);
    return asText ? {f:a+'&""', v:String(v===null || v===undefined ? '' : v)} : {f:a, v:v};
  };
  const sOccs = [];
  function summaryBlock(title, groups){
    sm.section(title);
    sm.header(colsS, true);
    groups.forEach(function(g){
      const rows = g.filter(function(c){ return refs[c[1]]; });
      rows.forEach(function(c, i){
        const ref = refs[c[1]];
        const occ = link(ref, ref.occCol, true);
        sOccs.push(occ.v);
        const border = function(j, n){
          const b = {bottom:xlLine(i===rows.length-1 ? XL.BLACK : XL.LINE)};
          if(i===0) b.top = xlLine(XL.BLACK);
          if(j===0) b.left = xlLine(XL.BLACK);
          if(j===n-1) b.right = xlLine(XL.BLACK);
          return b;
        };
        sm.row(colsS, [c[0], link(ref, ref.col), link(ref, ref.dateCol),
          ref.timeCol ? link(ref, ref.timeCol, true) : 'Full day', occ],
          {border:border, color:ref.timeCol ? null : {3:XL.LIGHT}});
      });
    });
  }
  summaryBlock('Daily Record Highs', [
    [['Total passengers','d_total'], ['Arrival passengers','d_arr'], ['Departure passengers','d_dep']],
    [['Total HKR','d_hkr_total'], ['Arrival HKR','d_hkr_arr'], ['Departure HKR','d_hkr_dep']],
    [['Total visitors','d_vis_total'], ['Arrival visitors','d_vis_arr'], ['Departure visitors','d_vis_dep']]]);
  sm.gap();
  summaryBlock('Hourly Record Highs', [
    [['Total passengers','h_total']],
    [['Arrival passengers','h_arr'], ['Departure passengers','h_dep']],
    [['Arrival HKR','h_hkr_arr'], ['Departure HKR','h_hkr_dep']],
    [['Arrival visitors','h_vis_arr'], ['Departure visitors','h_vis_dep']]]);
  sm.widths([24, 13, 17, 12, xlWidth(sOccs, 24)]);
  sm.finish(footer);

  const sheets = [sm, ttl, hkr, vis, hr, an];
  if(fc) sheets.push(fc);
  if(hist) sheets.push(hist);
  const wb = XLSX.utils.book_new();
  sheets.forEach(function(sh){ XLSX.utils.book_append_sheet(wb, sh.ws, sh.name); });
  wb.Props = {Title:'LSC Record High ('+era+') as at '+fDate(asat), Author:'LSC Passenger Statistics'};
  if(hist){
    wb.Workbook = {Names:[{Name:'_xlnm.Print_Titles', Sheet:sheets.indexOf(hist),
      Ref:"'"+hist.name+"'!$"+hist.print.titleRow+':$'+hist.print.titleRow}]};
  }
  return {wb:wb, sheets:sheets, era:era,
          filename:'RecordHigh_'+(isPC ? 'PostCOVID' : 'SinceCommissioning')+'_'+asat+'.xlsx'};
}

// Workbook bytes with print setup; falls back to the plain workbook if patching fails
function reportBytes(book){
  const raw = XLSX.write(book.wb, {bookType:'xlsx', type:'array', compression:true});
  try {
    return xlPatchWorkbook(raw, book.sheets);
  } catch(e){
    console.warn('Print setup skipped:', e);
    return new Uint8Array(raw);
  }
}

// --- PAGE ---------------------------------------------------------------------------
function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function setStatus(text, kind){
  const el = document.getElementById('status');
  el.className = kind || '';
  el.textContent = text || '';
}
function tick(){ return new Promise(function(r){ setTimeout(r, 30); }); }

// Same download route the xlsx library uses (Blob + temporary link)
function saveFile(u8, filename){
  const blob = new Blob([u8], {type:'application/octet-stream'});
  if(typeof navigator!=='undefined' && navigator.msSaveBlob) return navigator.msSaveBlob(blob, filename);
  if(typeof saveAs!=='undefined') return saveAs(blob, filename);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.download = filename; a.href = url;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
}

let reports = {};

async function handleFiles(fileList){
  const files = Array.from(fileList || []).filter(function(f){ return /\.xlsx?$/i.test(f.name); });
  if(!files.length){ setStatus('Please choose .xlsx or .xls files.', 'err'); return; }
  if(typeof XLSX==='undefined'){ setStatus('The Excel library did not load. Check the internet connection, then reload this page.', 'err'); return; }
  document.getElementById('result').hidden = true;
  try {
    const newDays = [];
    for(let i=0; i<files.length; i++){
      setStatus('Reading file '+(i+1)+' of '+files.length+': '+files[i].name);
      await tick();
      const wb = XLSX.read(await files[i].arrayBuffer(), {type:'array'});
      wb.SheetNames.forEach(function(sn){ newDays.push.apply(newDays, parseSheet(wb.Sheets[sn], files[i].name, sn)); });
    }
    if(!newDays.length){
      const wb = XLSX.read(await files[0].arrayBuffer(), {type:'array'});
      const sn = wb.SheetNames[0];
      const raw = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, defval:null});
      const preview = raw.slice(0, 20).map(function(r, i){ return 'R'+i+': '+JSON.stringify(r.slice(0, 8)); }).join('\n');
      setStatus('No daily data found. First rows of "'+sn+'":\n\n'+preview+'\n\nSend this screenshot to fix the reader.', 'err');
      return;
    }
    // Merge with anything loaded earlier; if a date appears twice keep the most complete day
    const merged = {};
    allDays.concat(newDays).forEach(function(d){
      const ex = merged[d.date];
      if(!ex || (d.dt.ad_tot||0)>(ex.dt.ad_tot||0)) merged[d.date] = d;
    });
    allDays = Object.keys(merged).sort().map(function(k){ return merged[k]; });
    allFileNames = allFileNames.concat(files.map(function(f){ return f.name; }));

    setStatus('Building the two reports...');
    await tick();
    reports = {};
    ['postcovid', 'since'].forEach(function(k){
      const book = buildReport(k);
      if(book) reports[k] = {name:book.filename, bytes:reportBytes(book)};
    });
    const keys = Object.keys(reports);
    keys.forEach(function(k, i){ setTimeout(function(){ saveFile(reports[k].bytes, reports[k].name); }, i*900); });

    setStatus('');
    const first = allDays[0].date, last = allDays[allDays.length-1].date;
    document.getElementById('resultText').innerHTML = '&#10003; <b>'+keys.length+' reports ready</b> &mdash; '+
      allDays.length.toLocaleString('en-US')+' days ('+fDate(first)+' to '+fDate(last)+') from '+
      allFileNames.length+' file'+(allFileNames.length>1 ? 's' : '')+'.';
    document.getElementById('btnPC').hidden = !reports.postcovid;
    document.getElementById('btnSC').hidden = !reports.since;
    document.getElementById('result').hidden = false;
  } catch(e){
    console.error(e);
    setStatus('Error: '+(e && e.message ? e.message : e), 'err');
  }
}

(function(){
  const dz = document.getElementById('drop');
  const input = document.getElementById('fileInput');
  input.addEventListener('change', function(){ handleFiles(input.files); input.value = ''; });
  window.addEventListener('dragover', function(e){ e.preventDefault(); dz.classList.add('over'); });
  window.addEventListener('dragleave', function(e){ if(!e.relatedTarget) dz.classList.remove('over'); });
  window.addEventListener('drop', function(e){
    e.preventDefault(); dz.classList.remove('over');
    if(e.dataTransfer && e.dataTransfer.files) handleFiles(e.dataTransfer.files);
  });
  document.getElementById('btnPC').addEventListener('click', function(){ if(reports.postcovid) saveFile(reports.postcovid.bytes, reports.postcovid.name); });
  document.getElementById('btnSC').addEventListener('click', function(){ if(reports.since) saveFile(reports.since.bytes, reports.since.name); });
  document.getElementById('btnClear').addEventListener('click', function(){
    allDays = []; allFileNames = []; reports = {};
    document.getElementById('result').hidden = true;
    setStatus('Cleared. Drop the Excel files again.');
  });
})();
</script>
